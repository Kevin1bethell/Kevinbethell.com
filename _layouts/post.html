---
layout: default
---
<article class="post"><p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p><h1>{{ page.title }}</h1>{% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}<div class="prose">{{ content }}</div>{% if page.tags.size > 0 %}<div class="entry-tags">{% for tag in page.tags %}<a class="tag-pill" href="{{ '/writing/' | relative_url }}?tag={{ tag | url_encode }}">{{ tag }}</a>{% endfor %}</div>{% endif %}</article>
